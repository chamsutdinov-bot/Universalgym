<script>
var LIB={
chest:{n:'Грудь',b:[['Жим штанги лёжа','4×8–10'],['Жим от груди в тренажёре','4×8–10']],e:[['Жим гантелей на наклонной','3×10–12'],['Сведение в кроссовере','3×12–15'],['Сведение в тренажёре','3×12–15']]},
back:{n:'Спина',b:[['Тяга верхнего блока к груди','4×8–12'],['Горизонтальная тяга с опорой','4×8–12']],e:[['Тяга верхнего блока узким хватом','3×10–12'],['Тяга в тренажёре с опорой на грудь','3×10–12'],['Горизонтальная тяга с опорой','3×10–12'],['Тяга верхнего блока к груди','3×10–12']]},
legs:{n:'Ноги',b:[['Приседания «колодец»','3×10–12']],e:[['Разгибание ног','3×12–15'],['Сгибание ног','3×12–15'],['Сведение ног в тренажёре','3×12–15'],['Разведение ног в тренажёре','3×12–15']]},
shoulders:{n:'Плечи',b:[['Жим гантелей сидя с опорой','4×8–10']],e:[['Разведение гантелей сидя','3×12–15'],['Обратная бабочка','3×12–15'],['Шраги с гантелями','3×12–15']]},
biceps:{n:'Бицепс',b:[],e:[['Сгибание рук с гантелями','3×10–12'],['Молотковые сгибания','3×10–12'],['Сгибание рук на Скотте','3×10–12']]},
triceps:{n:'Трицепс',b:[],e:[['Разгибание рук на блоке с канатом','3×10–12'],['Разгибание рук на блоке','3×10–12']]}
};
var KEY='trenirovki_v1',S=null,mem=null;
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function init(){S=load();if(!S||!S.h){S={h:[],cur:null,sv:3}}else S.sv=3;if(!S.mig1){if(S.kg==80)delete S.kg;if(S.kgw==60)delete S.kgw;S.mig1=1}norm();save()}
function lastW(name){for(var i=S.h.length-1;i>=0;i--){var it=S.h[i].it;for(var j=0;j<it.length;j++)if(it[j][0]==name)return it[j][2]}return null}
function lastFlag(name){for(var i=S.h.length-1;i>=0;i--){var it=S.h[i].it;for(var j=0;j<it.length;j++)if(it[j][0]==name)return !!it[j][3]}return false}
function sug(x){var l=lastW(x.n);if(l===null||!lastFlag(x.n))return null;return Math.round((l+(x.t=='b'?2.5:1))*2)/2}
function fillW(i,v){var e=document.getElementById('w'+i);if(e){e.value=v;cap()}}
function lastIdx(name){for(var i=S.h.length-1;i>=0;i--){var it=S.h[i].it;for(var j=0;j<it.length;j++)if(it[j][0]==name)return i}return -1}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function oldest(list,ban){var c=list.filter(function(x){return ban.indexOf(x[0])<0});if(!c.length)c=list;var m=Math.min.apply(null,c.map(function(x){return lastIdx(x[0])}));return rnd(c.filter(function(x){return lastIdx(x[0])==m}))}
function gen(){
var last=S.h[S.h.length-1],lg=last?last.g:'',seen=[];
S.h.slice(-1).forEach(function(w){w.it.forEach(function(x){seen.push(x[0])})});
var pg=['chest','back','legs','shoulders'].filter(function(g){return g!=lg&&LIB[g]});if(!pg.length)pg=Object.keys(LIB);if(!pg.length){var e0=document.getElementById('perr');if(e0)e0.textContent='Все упражнения исключены в «Травмы и ограничения»';return}var best=pg[0],bi=1e9;
pg.forEach(function(g){var v=Math.min.apply(null,LIB[g].b.map(function(x){return lastIdx(x[0])}));if(v<bi||(v==bi&&Math.random()<.5)){bi=v;best=g}});
var L=LIB[best],items=[],used=[];
var base=L.b.length?oldest(L.b,seen):null;if(base){items.push({n:base[0],s:base[1],t:'b'});used.push(base[0])}
for(var k=0;k<2;k++){var cl=L.e.filter(function(x){return used.indexOf(x[0])<0});if(!cl.length)break;var ex=oldest(cl,seen);items.push({n:ex[0],s:ex[1],t:'e'});used.push(ex[0])}
var others=Object.keys(LIB).filter(function(g){return g!=best});
others.sort(function(a,b){return (LIB[a].e.length&&LIB[b].e.length)?Math.min.apply(null,LIB[a].e.map(function(x){return lastIdx(x[0])}))-Math.min.apply(null,LIB[b].e.map(function(x){return lastIdx(x[0])}))+(Math.random()-.5):0});
var pick=others.slice(0,2);

else if(rpMode=='w'){var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+rpOff*7),wd=(d.getDay()+6)%7;a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7);var e=new Date(b.getFullYear(),b.getMonth(),b.getDate()-1);label=('0'+a.getDate()).slice(-2)+'.'+('0'+(a.getMonth()+1)).slice(-2)+' – '+('0'+e.getDate()).slice(-2)+'.'+('0'+(e.getMonth()+1)).slice(-2)}
else{a=new Date(now.getFullYear(),now.getMonth()+rpOff,1);b=new Date(a.getFullYear(),a.getMonth()+1,1);label=MN[a.getMonth()]+' '+a.getFullYear()}
return{a:a.getTime(),b:b.getTime(),label:label,start:a,days:Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5)}}

var h='';
L.forEach(function(w){var st=w.dur?w.ts-w.dur*1000:null;

var work=0,rest=0,rc=0,rows='',prev=null,worst=null;
m.forEach(function(x,k){var a=x[4].a,b=x[4].b,wk=Math.round((b-a)/1000),ns=exSets(x[1]),line='';work+=wk;
var gap=null;if(prev!==null){gap=Math.round((a-prev)/1000);rest+=gap;rc++}else if(st&&a>st)gap=Math.round((a-st)/1000);
var v=gap===null?null:restVerdict(gap,x[5]);
if(prev!==null&&v&&(!worst||gap>worst.g))worst={g:gap,n:x[0]};
rows+='<div style="padding:6px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:14px">'+esc(x[0])+'</span><b style="font-size:14px">'+wFmt(wk)+'</b></div><div class="meta">'+(ns?ns+' '+(ns==1?'подход':'подх.')+', в среднем '+wFmt(Math.round(wk/ns))+' на подход с отдыхом':x[1])+'</div>'+(gap!==null?'<div class="meta">'+(prev===null?'До первого упражнения: ':'Отдых перед ним: ')+'<b style="color:'+v.c+'">'+wFmt(gap)+(prev===null?'':' · '+v.t)+'</b></div>':'')+'</div>';
prev=b});
var tot=w.dur||0,idle=tot?Math.max(0,tot-work-rest):0,avg=rc?Math.round(rest/rc):null,av=avg===null?null:restVerdict(avg,'x');
h+='<div class="tiles" style="margin:8px 0"><div class="tile"><b>'+fmtDur(work)+'</b><span>работа по упражнениям</span></div><div class="tile"><b>'+(rc?fmtDur(rest):'—')+'</b><span>отдых между упражнениями</span></div></div>';
if(av){h+='<div style="font-size:14px;margin-bottom:4px">Между упражнениями ты отдыхал в среднем <b>'+wFmt(avg)+'</b>: <b style="color:'+av.c+'">'+av.t+'</b>.'+(worst&&worst.g>300?' Дольше всего ждал перед «'+esc(worst.n)+'» — '+wFmt(worst.g)+'.':'')+'</div><div class="meta">Ориентиры: после базовых 1–5 мин, после остальных 30 сек – 3 мин. '+(tot&&idle>tot*.25?'Ещё около '+fmtDur(idle)+' не попало в упражнения (разминка, переходы, пауза до первого и после последнего).':'')+'</div>'}
h+=rows+'</div>'});

е ставились, поэтому отдых по упражнениям посчитать нельзя. В следующей тренировке нажимай их, и здесь появится разбор.":["The \"Start\" and \"Done\" marks were not used on exercises, so rest between exercises cannot be calculated. Tap them in your next workout and the breakdown will appear here.","No se usaron las marcas «Empezar» y «Terminar» en los ejercicios, así que no se puede calcular el descanso. Úsalas en el próximo entrenamiento y aquí aparecerá el análisis.","Die Markierungen „Start“ und „Beendet“ wurden nicht gesetzt, daher lässt sich die Pause nicht berechnen. Tippe sie im nächsten Training an, dann erscheint hier die Auswertung.","Les marques « Début » et « Terminé » n'ont pas été utilisées, le repos ne peut donc pas être calculé. Utilise-les à la prochaine séance et l'analyse apparaîtra ici.","As marcas «Iniciar» e «Concluí» não foram usadas, então o descanso não pode ser calculado. Use-as no próximo treino e a análise aparecerá aqui.","I segni «Inizia» e «Finito» non sono stati usati, quindi il riposo non si può calcolare. Usali al prossimo allenamento e qui apparirà l'analisi.","Позначки «Почав» і «Закінчив» не ставилися, тому відпочинок між вправами порахувати не можна. Натискай їх у наступному тренуванні, і тут з'явиться розбір.","«Başla» ve «Bitti» işaretleri kullanılmadı, bu yüzden dinlenme hesaplanamıyor. Sonraki antrenmanda bunlara dokun, burada analiz görünecek.","未使用“开始”和“结束”标记，因此无法计算休息时间。下次训练时点击它们，这里就会出现分析。","「開始」「終了」を押していないため、休憩時間を計算できません。次のトレーニングで押すと、ここに分析が表示されます。","‘시작’과 ‘종료’ 표시를 누르지 않아 휴식 시간을 계산할 수 없습니다. 다음 운동에서 눌러 보세요. 여기에 분석이 나타납니다.","لم تُستخدم علامتا «بدء» و«انتهيت»، لذا لا يمكن حساب الراحة. اضغطهما في التمرين القادم وسيظهر التحليل هنا.","“शुरू” और “समाप्त” निशान नहीं लगाए गए, इसलिए आराम की गणना नहीं हो सकती। अगले वर्कआउट में इन्हें दबाएँ, यहाँ विश्लेषण दिखेगा।"],"работа по упражнениям":["time on exercises","tiempo de ejercicio","Übungszeit","temps d'exercice","tempo de exercício","tempo di esercizio","робота по вправах","egzersiz s Stuart McRobert and Brooks Kubik \"Bench Press 180 kg\": 5 phases (chest, delts, triceps, upper back, record), 3 workouts a week. The program is rewritten in my own words.","El curso de Stuart McRobert y Brooks Kubik «Press de banca 180 kg»: 5 fases (pecho, deltoides, tríceps, espalda alta, récord), 3 entrenamientos por semana. Programa reescrito con mis palabras.","Der Kurs von Stuart McRobert und Brooks Kubik „Bankdrücken 180 kg“: 5 Phasen (Brust, Schultern, Trizeps, oberer Rücken, Rekord), 3 Trainings pro Woche. Das Programm ist in eigenen Worten neu gefasst.","Le cours de Stuart McRobert et Brooks Kubik « Développé couché 180 kg » : 5 phases (pectoraux, deltoïdes, triceps, haut du dos, record), 3 séances par semaine. Programme reformulé avec mes mots.","O curso de Stuart McRobert e Brooks Kubik «Supino 180 kg»: 5 fases (peito, deltoides, tríceps, costas superiores, recorde), 3 treinos por semana. Programa reescrito com minhas palavras.","Il corso di Stuart McRobert e Brooks Kubik «Panca piana 180 kg»: 5 fasi (petto, deltoidi, tricipiti, parte alta della schiena, record), 3 allenamenti a settimana. Programma riscritto con parole mie.","Курс Стюарта МакРоберта і Брукса Кубіка «Жим лежачи 180 кг»: 5 фаз (груди, дельти, трицепс, верх спини, рекорд), 3 тренування на тиждень. Програму переписано власними словами.","Stuart McRobert ve Brooks Kubik'in «Bench Press 180 kg» kursu: 5 faz (göğüs, deltalar, arka kol, üst sırt, rekor), haftada 3 antrenman. Program kendi sözlerimle yeniden yazıldı.","Stuart McRobert 与 Brooks Kubik 的《卧推180公斤》课程：5个阶段（胸、三角肌、肱三头肌、上背、冲击纪录），每周3练。内容已用自己的话重写。","スチュアート・マクロバートとブルックス・クビックのコース「ベンチプレス180kg」：5つのフェーズ（胸、三角筋、上腕三頭筋、背中上部、記録更新）、週3回。内容は自分の言葉で再構成しています。","스튜어트 맥로버트와 브룩스 쿠빅의 「벤치프레스 180kg」 과정: 5단계(가슴, 어깨, 삼두, 상부 등, 기록 도전), 주 3회. 내용은 자체 표현으로 재구성했습니다.","دورة ستيوارت ماكروبرت وبروكس كوبيك «بنش 180 كغ»: 5 مراحل (الصدر، الدالية، ثلاثية الرؤوس، أعلى الظهر، الرقم القياسي)، 3 تمارين أسبوعياً. أُعيدت صياغة البرنامج بكلماتي.","स्टुअर्ट मैकरॉबर्ट और ब्रूक्स कुबिक का कोर्स «बेंच प्रेस 180 किग्रा»: 5 चरण (छाती, डेल्ट्स, ट्राइसेप्स, ऊपरी पीठ, रिकॉर्ड), सप्ताह में 3 वर्कआउट। कार्यक्रम अपने शब्दों में दोबारा लिखा गया है।"],"начинай с лёгких весов и от тренировки к тренировке добавляй, к 6-й неделе должно быть тяжело.":["start with light weights and add a little each workout; by week 6 it should feel heavy.","empieza con pesos ligeros y añade en cada entrenamiento; en la semana 6 debe costar.","beginne mit leichten Gewichten und steigere dich von Training zu Training; in Woche 6 sollte es schwer sein.","commence léger et ajoute à chaque séance ; à la semaine 6 ça doit être lourd.","comece com cargas leves e aumente a cada treino; na semana 6 deve estar pesado.","parti con pesi leggeri e aumenta a ogni allenamento; alla settimana 6 deve essere pesante.","починай з легких ваг і додавай від тренування до тренування; до 6-го тижня має бути важко.","hafif ağırlıklarla başla, her antrenmanda biraz ekle; 6. haftada zor olmalı.","从轻重量开始，每次训练递增，到第6周应感到吃力。","軽い重量から始め、毎回少しずつ増やし、6週目には重く感じるようにします。","가벼운 무게로 시작해 매 운동마다 늘리고, 6주차에는 힘들어야 합니다.","ابدأ بأوزان خفيفة وزد في كل تمرين، وفي الأسبوع 6 يجب أن يكون ثقيلاً.","हल्के वजन से शुरू करें और हर वर्कआउट में बढ़ाएँ; 6वें सप्ताह तक भारी लगना चाहिए।"],"веса «заморожены» везде, кроме жима лёжа и упражнений на «":["weights are \"frozen\" everywhere except bench press and exercises for «","los pesos están «congelados» salvo en el press de banca y los ejercicios de «","die Gewichte sind „eingefroren“, außer beim Bankdrücken und Übungen für «","les charges sont « figées » sauf au développé couché et aux exercices pour «","as cargas ficam «congeladas», exceto no supino e nos exercícios de «","i pesi sono «congelati» tranne in panca e negli esercizi per «","ваги «заморожені» скрізь, крім жиму лежачи та вправ на «","ağırlıklar «sabit»; yalnızca bench press ve şu hareketlerde artar: «","除卧推和针对“","ベンチプレスと「","벤치프레스와 「","الأوزان «مجمّدة» في كل شيء عدا البنش وتمارين «","वजन बेंच प्रेस और «"],"В них добавляй 1–2 кг в неделю.":["Add 1–2 kg per week to those.","En esos añade 1–2 kg por semana.","Dort steigerst du 1–2 kg pro Woche.","Sur ceux-là, ajoute 1–2 kg par semaine.","Neles, adicione 1–2 kg por semana.","In quelli aggiungi 1–2 kg a settimana.","У них додавай 1–2 кг на тиждень.","Bunlarda haftada 1–2 kg ekle.","这些动作每周加1–2公斤。","それらは週に1〜2kg増やします。","그 운동들은 매주 1–2kg씩 늘리세요.","أضف 1–2 كغ أسبوعياً فيها.","इनमें हर सप्ताह 1–2 किग्रा बढ़ाएँ।"],"Последняя тренировка фазы: 2 разминочных сета по 5, затем одиночные жимы до веса на 5–7 кг ниже прежнего максимума, потом +2 кг к рекорду.":["Last workout of the phase: 2 warm-up sets of 5, then single presses up to 5–7 kg below your old max, then +2 kg over your record.","Último entrenamiento de la fase: 2 series de calentamiento de 5, luego repeticiones únicas hasta 5–7 kg por debajo de tu máximo y después +2 kg sobre tu récord.","Letztes Training der Phase: 2 Aufwärmsätze à 5, dann Einzelwiederholungen bis 5–7 kg unter dem alten Maximum, danach +2 kg über dem Rekord.","Dernière séance de la phase : 2 séries d'échauffement de 5, puis des singles jusqu'à 5–7 kg sous ton ancien max, puis +2 kg au-dessus de ton record.","Último treino da fase: 2 séries de aquecimento de 5, depois repetições únicas até 5–7 kg abaixo do seu máximo antigo e então +2 kg sobre o recorde.","Ultimo allenamento della fase: 2 serie di riscaldamento da 5, poi singole fino a 5–7 kg sotto il vecchio massimale, poi +2 kg sul record.","Останнє тренування фази: 2 розминкові підходи по 5, потім поодинокі жими до ваги на 5–7 кг нижче колишнього максимуму, потім +2 кг до рекорду.","Fazın son antrenmanı: 5'er tekrarlık 2 ısınma seti, sonra eski maksimumunun 5–7 kg altına kadar tekli kaldırışlar, ardından rekorun +2 kg üzeri.","本阶段最后一次训练：2组各5次热身，然后做单次推举直到比旧最大重量低5–7公斤，最后在纪录上加2公斤。","フェーズ最後のトレーニング：5回のウォームアップ2セット、その後、以前の最大より5〜7kg軽い重量まで単発、最後に記録+2kg。","이번 단계 마지막 운동: 5회 워밍업 2세트, 이후 이전 최대보다 5–7kg 낮은 무게까지 싱글, 마지막으로 기록 +2kg.","آخر تمرين في المرحلة: مجموعتا إحماء من 5، ثم ضغطات مفردة حتى وزن أقل بـ5–7 كغ من أقصاك السابق، ثم +2 كغ فوق رقمك القياسي.","चरण का आख़िरी वर्कआउट: 5-5 के 2 वार्म-अप सेट, फिर पुराने मैक्स से 5–7 किग्रा कम तक सिंगल प्रेस, फिर रिकॉर्ड से +2 किग्रा।"],"Не лезь выше рекорда раньше 4-й недели. Остальные веса — по 6-недельной волне: от лёгких к тяжёлым, потом снова к лёгким.":["Do not go above your record before week 4. Other weights follow a 6-week wave: from light to heavy, then light again.","No superes tu récord antes de la semana 4. Los demás pesos siguen una onda de 6 semanas: de ligero a pesado y otra vez ligero.","Gehe vor Woche 4 nicht über deinen Rekord. Die übrigen Gewichte folgen einer 6-Wochen-Welle: von leicht zu schwer, dann wieder leicht.","Ne dépasse pas ton record avant la semaine 4. Les autres charges suivent une vague de 6 semaines : du léger au lourd, puis de nouveau léger.","Não passe do seu recorde antes da semana 4. As demais cargas seguem uma onda de 6 semanas: de leve a pesada e de novo leve.","Non superare il record prima della settimana 4. Gli altri pesi seguono un'onda di 6 settimane: da leggeri a pesanti, poi di nuovo leggeri.","Не лізь вище рекорду раніше 4-го тижня. Решта ваг — за 6-тижневою хвилею: від легких до важких, потім знову до легких.","4. haftadan önce rekorunu aşma. Diğer ağırlıklar 6 haftalık dalgayı izler: hafiften ağıra, sonra yine hafife.","第4周之前不要超过你的纪录。其他重量按6周波浪：由轻到重，再回到轻。","4週目までは記録を超えないでください。他の重量は6週間の波で、軽→重→再び軽。","4주차 전에는 기록을 넘기지 마세요. 나머지 무게는 6주 파동으로: 가볍게→무겁게→다시 가볍게.","لا تتجاوز رقمك القياسي قبل الأسبوع 4. بقية الأوزان تتبع موجة 6 أسابيع: من الخفيف إلى الثقيل ثم الخفيف مجدداً.","चौथे सप्ताह से पहले रिकॉर्ड से ऊपर न जाएँ। बाकी वजन 6 सप्ताह की लहर में चलते हैं: हल्के से भारी, फिर फिर हल्के।"],"Отдых между тяжёлыми сетами 3–5 минут.":["Rest 3–5 minutes between heavy sets.","Descansa 3–5 minutos entre series pesadas.","Pausiere 3–5 Minuten zwischen schweren Sätzen.","Repose-toi 3 à 5 minutes entre les séries lourdes.","Descanse 3–5 minutos entre séries pesadas.","Riposa 3–5 minuti tra le urs — fessiers et jambes, haut du corps, jambes et abdos, fessiers et gainage. Plus de répétitions (10–15), accent sur fessiers et cuisses.","Programa para mulheres: ciclo de 4 dias — glúteos e pernas, parte superior, pernas e abdômen, glúteos e core. Mais repetições (10–15), foco em glúteos e coxas.","Programma per donne: ciclo di 4 giorni — glutei e gambe, parte alta, gambe e addominali, glutei e core. Più ripetizioni (10–15), focus su glutei e cosce.","Програма для дівчат: 4 дні по колу — сідниці та ноги, верх тіла, ноги та прес, сідниці та корпус. Більше повторень (10–15), акцент на сідниці та стегна.","Kadınlar için program: 4 günlük döngü — kalça ve bacaklar, üst vücut, bacaklar ve karın, kalça ve core. Daha çok tekrar (10–15), kalça ve uyluklara odak.","女性训练计划：4天循环——臀部与腿、上半身、腿与腹部、臀部与核心。次数更多（10–15次），重点练臀部和大腿。","女性向けプログラム：4日サイクル——お尻と脚、上半身、脚と腹筋、お尻と体幹。回数多め（10〜15回）、お尻と太ももを重点的に。","여성용 프로그램: 4일 순환 — 엉덩이와 다리, 상체, 다리와 복근, 엉덩이와 코어. 반복 횟수 많게(10–15회), 엉덩이와 허벅지 중심.","برنامج للنساء: دورة 4 أيام — الأرداف والساقان، الجزء العلوي، الساقان والبطن، الأرداف والجذع. تكرارات أكثر (10–15) مع التركيز على الأرداف والفخذين.","महिलाओं के लिए कार्यक्रम: 4 दिन का चक्र — ग्लूट्स और पैर, ऊपरी शरीर, पैर और एब्स, ग्लूट्स और कोर। रेप्स ज़्यादा (10–15), ग्लूट्स और जांघों पर ज़ोर।"],"Отдых: 2 минуты на базовых упражнениях, 60–90 секунд на остальных.":["Rest: 2 minutes on main lifts, 60–90 seconds on the rest.","Descanso: 2 minutos en los básicos, 60–90 segundos en el resto.","Pause: 2 Minuten bei Grundübungen, 60–90 Sekunden bei den übrigen.","Repos : 2 minutes sur les exercices de base, 60–90 secondes sur les autres.","Descanso: 2 minutos nos básicos, 60–90 segundos nos demais.","Riposo: 2 minuti sui fondamentali, 60–90 secondi sugli altri.","Відпочинок: 2 хвилини на базових вправах, 60–90 секунд на решті.","Dinlenme: temel hareketlerde 2 dakika, diğerlerinde 60–90 saniye.","休息：基础动作2分钟，其他60–90秒。","休憩：基本種目は2分、その他は60〜90秒。","휴식: 기본 운동은 2분, 나머지는 60–90초.","الراحة: دقيقتان في التمارين الأساسية و60–90 ثانية في البقية.","आराम: मुख्य व्यायामों में 2 मिनट, बाकी में 60–90 सेकंड।"],"Добавляй 1–2 кг, когда все подходы даются с запасом.":["Add 1–2 kg when every set feels comfortable.","Añade 1–2 kg cuando todas las series te salgan con margen.","Steigere um 1–2 kg, wenn alle Sätze mit Reserve gelingen.","Ajoute 1–2 kg quand toutes les séries passent avec de la marge.","Adicione 1–2 kg quando todas as séries saírem com folga.","Aggiungi 1–2 kg quando tutte le serie riescono con margine.","Додавай 1–2 кг, коли всі підходи даються із запасом.","Tüm setler rahat geldiğinde 1–2 kg ekle.","当所有组都轻松完成时，加1–2公斤。","全セットに余裕があれば1〜2kg増やします。","모든 세트에 여유가 있으면 1–2kg 늘리세요.","أضف 1–2 كغ عندما تكون كل المجموعات مريحة.","जब सभी सेट आराम से हों तो 1–2 किग्रा बढ़ाएँ।"],"Если самочувствие неважное, снизь вес на 10–20%, но объём оставь.":["If you feel off, lower the weight by 10–20% but keep the volume.","Si no te sientes bien, baja el peso un 10–20 % pero mantén el volumen.","Wenn du dich nicht gut fühlst, senke das Gewicht um 10–20 %, behalte aber das Volumen.","Si tu forme est basse, baisse la charge de 10–20 % mais garde le volume.","Se não estiver se sentindo bem, reduza a carga em 10–20%, mas mantenha o volume.","Se non ti senti al meglio, riduci il peso del 10–20% ma mantieni il volume.","Якщо самопочуття не дуже, знизь вагу на 10–20%, але обсяг залиш.","Kendini iyi hissetmiyorsan ağırlığı %10–20 azalt ama hacmi koru.","如果状态不好，把重量降低10–20%，但保持训练量。","体調が優れない日は重量を10〜20%下げ、ボリュームは保ちます。","컨디션이 안 좋으면 무게를 10–20% 낮추고 볼륨은 유지하세요.","إذا كنتِ لا تشعرين بتحسن فخفضي الوزن 10–20% مع الإبقاء على الحجم.","अगर तबीयत ठीक न हो तो वजन 10–20% घटाएँ, पर वॉल्यूम बनाए रखें।"],"на каждую руку":["per arm","por brazo","pro Arm","par bras","por braço","per braccio","на кожну руку","her kol için","每条手臂","片腕ずつ","한 팔씩","لكل ذراع","हर हाथ के लिए"],"Ориентир по твоему весу: ~":["Guide for your body weight: ~","Referencia según tu peso: ~","Richtwert nach deinem Gewicht: ~","Repère selon ton poids : ~","Referência pelo s  forza e WOD — esercizi senza lunghe pause.","CrossFit: сила плюс функціональний комплекс. 4 дні по колу, у кожному силова частина і WOD — вправи без зайвих пауз.","CrossFit: kuvvet artı fonksiyonel antrenman. 4 günlük döngü, her gün kuvvet bölümü ve WOD — gereksiz mola olmadan.","CrossFit：力量加功能性训练。4天循环，每天含力量部分和WOD——动作之间少停顿。","CrossFit：筋力＋ファンクショナルトレーニング。4日サイクル、各日に筋力パートとWOD——休憩は最小限。","크로스핏: 근력 + 기능성 운동. 4일 순환, 매일 근력 파트와 WOD — 불필요한 휴식 없이.","كروس فيت: قوة بالإضافة إلى تمرين وظيفي. دورة 4 أيام، في كل يوم جزء قوة وWOD — تمارين بدون راحة طويلة.","क्रॉसफिट: ताकत और फंक्शनल वर्कआउट। 4 दिन का चक्र, हर दिन ताकत वाला हिस्सा और WOD — बिना ज़्यादा रुके।"],"ОФП: общая физическая подготовка. 3 дня по кругу, всё тело, умеренные веса и немного кардио.":["GPP: general physical preparation. A 3-day loop, full body, moderate weights and a little cardio.","Preparación física general. Ciclo de 3 días, cuerpo completo, pesos moderados y algo de cardio.","Allgemeine körperliche Fitness. 3 Tage im Wechsel, Ganzkörper, mäßige Gewichte und etwas Cardio.","Préparation physique générale. Boucle de 3 jours, corps entier, charges modérées et un peu de cardio.","Preparação física geral. Ciclo de 3 dias, corpo inteiro, cargas moderadas e um pouco de cardio.","Preparazione fisica generale. Ciclo di 3 giorni, tutto il corpo, pesi moderati e un po' di cardio.","ЗФП: загальна фізична підготовка. 3 дні по колу, все тіло, помірні ваги та трохи кардіо.","Genel fiziksel hazırlık. 3 günlük döngü, tüm vücut, orta ağırlıklar ve biraz kardiyo.","综合体能训练：3天循环，全身，中等重量加少量有氧。","総合的な体力づくり：3日サイクル、全身、中程度の重量と軽い有酸素。","종합 체력 운동: 3일 순환, 전신, 중간 무게와 약간의 유산소.","لياقة بدنية عامة: دورة 3 أيام، للجسم كله، بأوزان معتدلة وقليل من الكارديو.","सामान्य शारीरिक तैयारी: 3 दिन का चक्र, पूरा शरीर, मध्यम वजन और थोड़ा कार्डियो।"],"Сначала силовые подходы с отдыхом 2–3 минуты, затем WOD: упражнения подряд по кругу, отдых 1–2 минуты между кругами. Следи за техникой, когда устаёшь.":["Strength sets first with 2–3 minutes rest, then the WOD: exercises back to back in rounds, 1–2 minutes rest between rounds. Watch your technique when tired.","Primero las series de fuerza con 2–3 minutos de descanso, luego el WOD: ejercicios seguidos en rondas, 1–2 minutos entre rondas. Cuida la técnica cuando te canses.","Zuerst Kraftsätze mit 2–3 Minuten Pause, dann das WOD: Übungen nacheinander in Runden, 1–2 Minuten Pause zwischen den Runden. Achte bei Müdigkeit auf die Technik.","D'abord les séries de force avec 2 à 3 minutes de repos, puis le WOD : exercices enchaînés en tours, 1 à 2 minutes entre les tours. Soigne ta technique quand tu fatigues.","Primeiro as séries de força com 2–3 minutos de descanso, depois o WOD: exercícios em sequência por rodadas, 1–2 minutos entre as rodadas. Cuide da técnica quando cansar.","Prima le serie di forza con 2–3 minuti di riposo, poi il WOD: esercizi di fila a giri, 1–2 minuti tra i giri. Cura la tecnica quando sei stanco.","Спочатку силові підходи з відпочинком 2–3 хвилини, потім WOD: вправи поспіль по колу, відпочинок 1–2 хвилини між колами. Стеж за технікою, коли втомлюєшся.","Önce 2–3 dakika dinlenmeli kuvvet setleri, sonra WOD: hareketler art arda turlar halinde, turlar arasında 1–2 dakika dinlen. Yorulunca tekniğe dikkat et.","先做力量组，休息2–3分钟，然后是WOD：动作连续按轮进行，每轮之间休息1–2分钟。疲劳时注意动作标准。","まず筋力セット（休憩2〜3分）、その後WOD：種目を続けてラウンドで行い、ラウンド間は1〜2分休憩。疲れたらフォームに注意。","먼저 2–3분 휴식하며 근력 세트, 이후 WOD: 운동을 연달아 라운드로 진행하고 라운드 사이 1–2분 휴식. 피곤할 때 자세에 주의하세요.","ابدأ بمجموعات القوة مع راحة 2–3 دقائق، ثم WOD: تمارين متتالية في جولات وراحة 1–2 دقيقة بين الجولات. انتبه لأسلوبك عند التعب.","पहले ताकत के सेट, 2–3 मिनट आराम के साथ, फिर WOD: व्यायाम लगातार राउंड में, राउंड के बीच 1–2 मिनट आराम। थकान में तकनीक का ध्यान रखें।"],"Работай в комфортном темпе, отдых 60–90 секунд. Вес бери такой, чтобы последние повторения давались с усилием, но без потери техники.":["Work at a comfortable pace, rest 60–90 seconds. Choose a weight where the last reps take effort but your technique holds.","Trabaja a un ritmo cómodo, descansa 60–90 segundos. Elige un peso con el que las últimas repeticiones cuesten pero mantengas la técnica.","Arbeite in angenehmem Tempo, 60–90 Sekunden Pause. Wähle ein Gewicht, bei dem die letzten Wiederholungen anstrengend sind, die Technik aber stimmt.","Travaille à un rythme confortable, repos de 60 à 90 secondes. Choisis une charge où les dernières répétitions demandent de l'effort sans perdre la technique.","Trabalhe em ritmo confortável, descanse 60–90 segundos. Escolha uma carga em que as últimas repetições exijam esforço, mas sem perder a técnica.","Lavora a ritmo comodo, riposo 60–90 secondi. Scegli un peso con cui le ultime ripetizioni richiedono impegno ma senza perdere la tecnica.","Працюй у комфортному темпі, відпочинок 60–90 секунд. Бери таку вагу, щоб останні повторення давалися зусиллям, але без втрати техніки.","Rahat tempoda çalış, 60–90 saniye dinlen. Son tekrarların zorlandığı ama tekniğin bozulmadığı bir ağırlık seç.","以舒适的节奏训练，休息60–90秒。选择让最后几次吃力但动作不变形的重量。","無理のないペースで、休憩は60〜90秒。最後の数回がきついがフォームが崩れない重量を選びます。","편안한 속도로 하고 60–90초 쉬세요. 마지막 반복이 힘들지만 자세가 무너지지 않는 무게를 고르세요.","اعمل بإيقاع مريح وارتح 60–90 ثانية. اختر وزناً تكون فيه التكرارات الأخيرة شاقة دون فقدان الأسلوب.","आरामदायक गति से करें, 60–90 सेकंड आराम। ऐसा वजन चुनें कि आख़िरी रेप्स में ज़ोर लगे पर तकनीक बनी रहे।"],"Работа":["Work","Trabajo","Arbeit","Effort","Trabalho","Lavoro","Робота","Çalışma","训练","ワーク","운동","عمل","काम"],"Подход":["Set","Serie","Satz","Série","Série","Serie","Підхід","Set","第","セット","세트","مجموعة","सेट"],"Пауза":["Pause","Pausa","Pause","Pause","Pausa","Pausa","Пауза","Duraklat","暂停","一時停止","일시정지","إيقاف مؤقت","रोकें"],"Продолжить":["Resume","Continuar","Weiter","Reprendre","Continuar","Riprendi","Продовжити","Devam","继续","再開","계속","استئناف","जारी रखें"],"Дальше:":["Next:","Siguiente:","Als Nächstes:","Ensuite :","A seguir:","Dopo:","Далі:","Sıradaki:","下一个：","次：","다음:","التالي:","अगला:"],"Время вышло — жми «Закончить тренировку»":["Time is up — tap \"Finish workout\"","Se acabó el tiempo: pulsa «Terminar entrenamiento»","Zeit ist um – tippe auf „Training beenden“","Temps écoulé — appuie sur « Terminer l'entraînement »","Acabou o tempo — toque em «Finalizar treino»","Tempo scaduto — tocca «Termina allenamento»","Час вийшов — натисни «Закінчити тренування»","Süre doldu — «Antrenmanı bitir»'e dokun","时间到——点击“结束训练”","時間終了——「トレーニング終了」をタップ","시간 종료 — «운동 끝내기»를 누르세요","انتهى الوقت — اضغط «إنهاء التمرين»","समय पूरा — «वर्कआउट समाप्त करें» दबाएँ"],"CrossFit + ОФП: 60 минут по таймеру. Минута работы, 30 секунд отдыха, по кругу — 8 упражнений по 5 подходов.":["CrossFit + GPP: 60 minutes on a timer. One minute of work, 30 seconds of rest, in a loop — 8 exercises, 5 sets each.","CrossFit + preparación física: 60 minutos con temporizador. Un minuto de trabajo, 30 segundos de descanso, en circuito: 8 ejercicios de 5 series.","CrossFit + Fitness: 60 Minuten per Timer. Eine Minute Arbeit, 30 Sekunden Pause, im Kreis – 8 Übungen mit je 5 Sätzen.","CrossFit + préparation physique : 60 minutes au chrono. Une minute d'effort, 30 secondes de repos, en boucle — 8 exercices de 5 séries.","CrossFit + preparação física: 60 minutos no timer. Um minuto de trabalho, 30 segundos de descanso, em circuito — 8 exercícios de 5 séries.","CrossFit + preparazione fisica: 60 minuti a timer. Un minuto di lavoro, 30 secondi di riposo, a circuito — 8 esercizi da 5 serie.","CrossFit + ЗФП: 60 хвилин за таймером. Хвилина роботи, 30 секунд відпочинку, по колу — 8 вправ по 5 підходів.","CrossFit + genel kondisyon: zamanlayıcıyla 60 dakika. Bir dakika çalışma, 30 saniye dinlenme, döngüde — 5'er setlik 8 hareket.","CrossFit + 综合体能：60分钟计时。练1分钟、休息30秒，循环进行——8个动作，每个5组。","CrossFit＋総合体力：タイマーで60分。1分運動・30秒休憩の繰り返し——8種目×各5セット。","크로스핏 + 종합 체력: 타이머로 60분. 1분 운동, 30초 휴식을 반복 — 8가지 운동, 각 5세트.","كروس فيت + لياقة عامة: 60 دقيقة بالمؤقت. دقيقة عمل و30 ثانية راحة بالتناوب — 8 تمارين، 5 مجموعات لكل منها.","क्रॉसफिट + सामान्य फिटनेस: टाइमर पर 60 मिनट। 1 मिनट काम, 30 सेकंड आराम, चक्र में — 8 व्यायाम, हर एक के 5 सेट।"],"Сигнал: один — началась минута работы, два — 30 секунд отдыха. Держи экран и звук включёнными.":["Signal: one beep — the work minute has started, two — 30 seconds of rest. Keep the screen and sound on.","Señal: un pitido, empieza el minuto de trabajo; dos, 30 segundos de descanso. Mantén la pantalla y el sonido activados.","Signal: ein Ton – die Arbeitsminute beginnt, zwei – 30 Sekunden Pause. Lass Bildschirm und Ton eingeschaltet.","Signal : un bip — la minute d'effort commence, deux — 30 secondes de repos. Garde l'écran et le son activés.","Sinal: um bipe — começou o minuto de trabalho, dois — 30 segundos de descanso. Mantenha a tela e o som ligados.","Segnale: un bip — inizia il minuto di lavoro, due — 30 secondi di riposo. Tieni schermo e audio accesi.","Сигнал: один — почалась хвилина роботи, два — 30 секунд відпочинку. Тримай екран і звук увімкненими.","Sinyal: bir bip — çalışma dakikası başladı, iki bip — 30 saniye dinlenme. Ekranı ve sesi açık tut.","提示音：一声表示1分钟训练开始，两声表示休息30秒。请保持屏幕和声音开启。","合図：1回＝運動の1分開始、2回＝30秒休憩。画面と音をオンにしておいてください。","신호음: 한 번 — 1분 운동 시작, 두 번 — 30초 휴식. 화면과 소리를 켜 두세요.","الإشارة: صوت واحد — بدأت دقيقة العمل، صوتان — 30 ثانية راحة. أبقِ الشاشة والصوت قيد التشغيل.","संकेत: एक बीप — काम का मिनट शुरू, दो बीप — 30 सेकंड आराम। स्क्रीन और आवाज़ चालू रखें।"],"Присед с блином и выжиманием вперёд":["Plate squat with front press","Sentadilla con disco y empuje al frente","Kniebeuge mit Hantelscheibe und Vorwärtsdrücken","Squat avec disque et poussée vers l'avant","Agachamento com anilha e empurrão à frente","Squat con disco e spinta in avanti","Присід з блином і виштовхуванням уперед","Plaka ile squat ve öne itme","杠铃片深蹲前推","プレートスクワット＆前方プレス","원판 스쿼트 앞으로 밀기","سكوات بالقرص مع دفع للأمام","प्लेट स्क्वाट और आगे प्रेस"],"Приседания с блином над головой":["Overhead plate squats","Sentadillas con disco sobre la cabeza","Kniebeugen mit Hantelscheibe über Kopf","Squats avec disque au-dessus de la tête","Agachamento com anilha sobre a cabeça","Squat con d رين، 5 مجموعات لكل منها، بأوزان أخف وتركيز أكبر على الأرداف والجذع.","महिलाओं के लिए क्रॉसफिट: टाइमर पर 60 मिनट। 1 मिनट काम, 30 सेकंड आराम, चक्र में — 8 व्यायाम, हर एक के 5 सेट, हल्के वजन, ग्लूट्स और कोर पर ज़्यादा ज़ोर।"],"Дом с резинкой: 3 дня по кругу, без зала. Нужна только мини-петля или длинная резинка, пол и немного места.":["Home with a band: a 3-day loop, no gym. You only need a mini loop or a long band, a floor and a bit of space.","Casa con banda: ciclo de 3 días, sin gimnasio. Solo necesitas una mini banda o una banda larga, suelo y algo de espacio.","Zuhause mit Band: 3 Tage im Wechsel, ohne Studio. Du brauchst nur ein Mini-Loop- oder langes Band, Boden und etwas Platz.","À la maison avec élastique : boucle de 3 jours, sans salle. Il te faut seulement un mini-loop ou un long élastique, un sol et un peu de place.","Em casa com elástico: ciclo de 3 dias, sem academia. Você só precisa de um mini band ou elástico longo, chão e um pouco de espaço.","A casa con elastico: ciclo di 3 giorni, senza palestra. Servono solo un mini loop o un elastico lungo, il pavimento e un po' di spazio.","Дім із резинкою: 3 дні по колу, без залу. Потрібна лише міні-петля або довга резинка, підлога і трохи місця.","Bantla evde: 3 günlük döngü, salon yok. Sadece bir mini bant veya uzun bant, zemin ve biraz alan yeterli.","居家弹力带训练：3天循环，无需健身房。只需迷你弹力圈或长弹力带、地面和一点空间。","自宅でバンドトレーニング：3日サイクル、ジム不要。ミニバンドまたはロングバンド、床、少しのスペースだけでOK。","집에서 밴드 운동: 3일 순환, 헬스장 필요 없음. 미니 밴드나 긴 밴드, 바닥, 약간의 공간만 있으면 됩니다.","التمرين في المنزل بالحزام: دورة 3 أيام بدون نادٍ. تحتاجين فقط إلى حزام صغير أو طويل وأرضية ومساحة بسيطة.","बैंड के साथ घर पर: 3 दिन का चक्र, बिना जिम के। बस एक मिनी लूप या लंबा बैंड, फ़र्श और थोड़ी जगह चाहिए।"],"Резинку подбирай так, чтобы последние повторения давались с усилием. Отдых 45–60 секунд.":["Choose a band so the last reps take effort. Rest 45–60 seconds.","Elige una banda con la que las últimas repeticiones cuesten. Descansa 45–60 segundos.","Wähle ein Band, bei dem die letzten Wiederholungen anstrengend sind. 45–60 Sekunden Pause.","Choisis un élastique qui demande de l'effort sur les dernières répétitions. Repos de 45 à 60 secondes.","Escolha um elástico em que as últimas repetições exijam esforço. Descanse 45–60 segundos.","Scegli un elastico con cui le ultime ripetizioni richiedono impegno. Riposo 45–60 secondi.","Добирай резинку так, щоб останні повторення давалися зусиллям. Відпочинок 45–60 секунд.","Son tekrarlar zorlanacak şekilde bir bant seç. 45–60 saniye dinlen.","选择让最后几次吃力的弹力带。休息45–60秒。","最後の数回がきつくなるバンドを選びます。休憩は45〜60秒。","마지막 반복이 힘든 정도의 밴드를 고르세요. 45–60초 쉬세요.","اختاري حزاماً تكون فيه التكرارات الأخيرة شاقة. ارتاحي 45–60 ثانية.","ऐसा बैंड चुनें कि आख़िरी रेप्स में ज़ोर लगे। 45–60 सेकंड आराम करें।"]};
